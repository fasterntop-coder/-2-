name: Batch213 strict re-extraction records
on:
  push:
    paths:
      - 'tools/verify_cd1_reextraction_asset_records.py'
      - '.github/workflows/batch213-strict-reextraction-records.yml'
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_cd1_reextraction_asset_records.py --selftest
