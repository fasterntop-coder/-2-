name: ST2 exact recovery self-tests

on:
  push:
    paths:
      - "tools/**"
      - "jobs/**"
      - "manifests/**"
      - ".github/workflows/pbook-search-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: |
          python -m py_compile tools/pbook_palette_transfer_search.py
          python -m py_compile tools/extract_glyph_by_sha.py
          python -m py_compile tools/run_pbook_bt_height_low.py
          python -m py_compile tools/recover_pbook_bt_b110.py
          python -m py_compile tools/recover_exact_patch_from_manifest.py
          python -m py_compile tools/recover_checkpoint_mosaic.py
          python -m py_compile tools/extract_apply_manifest.py
          python -m py_compile tools/recover_b118_sidecars.py
          python -m py_compile tools/recover_b118_character_maps.py
          python -m py_compile tools/recover_fixed_record_layout.py
          python -m py_compile tools/extract_mes_fixed_layout.py
          python -m py_compile tools/assemble_exact_mes_assets.py
          python -m py_compile tools/recover_exact_assets_from_checkpoints.py
          python -m py_compile tools/extract_b118_assets_manifest.py
          python -m py_compile tools/recover_integrate_production_assets.py
          python -m py_compile tools/compose_exact_asset_lineage.py
      - name: Recover exact synthetic glyphs by SHA
        run: python tools/extract_glyph_by_sha.py selftest
      - name: Recover synthetic multi-level transfer
        run: python tools/pbook_palette_transfer_search.py selftest
      - name: Validate PBOOK raw-sector and ZIP recovery
        run: python tools/recover_pbook_bt_b110.py selftest
      - name: Validate complete exact-patch roundtrip
        run: python tools/recover_exact_patch_from_manifest.py selftest
      - name: Validate multi-checkpoint sector mosaic roundtrip
        run: python tools/recover_checkpoint_mosaic.py selftest
      - name: Validate legacy apply-script parser
        run: python tools/extract_apply_manifest.py selftest
      - name: Validate B118 sidecar recovery
        run: python tools/recover_b118_sidecars.py selftest
      - name: Validate B118 character-map recovery
        run: python tools/recover_b118_character_maps.py selftest
      - name: Validate fixed-allocation record SHA recovery
        run: python tools/recover_fixed_record_layout.py selftest
      - name: Validate MES fixed-layout SHA-oracle extraction
        run: python tools/extract_mes_fixed_layout.py selftest
      - name: Validate exact MES asset assembly
        run: python tools/assemble_exact_mes_assets.py selftest
      - name: Validate correct MODE1 checkpoint asset recovery
        run: python tools/recover_exact_assets_from_checkpoints.py selftest
      - name: Validate B118 58-asset workbook manifest extraction
        run: python tools/extract_b118_assets_manifest.py selftest
      - name: Validate exact story/movie production integration
        run: |
          python tools/recover_integrate_production_assets.py selftest
          python tools/recover_integrate_production_assets.py validate manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json
      - name: Validate direct exact battle/static lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.recover_exact_assets_from_checkpoints import validate_manifest
          def load(name):
              data = json.loads(Path(name).read_text(encoding='utf-8'))
              assets, disc = validate_manifest(data)
              return data, assets, disc
          b113, a113, d113 = load('manifests/BATCH113_19_EXACT_TARGETS.json')
          b114, a114, d114 = load('manifests/BATCH114_25_EXACT_TARGETS.json')
          b115, a115, d115 = load('manifests/BATCH115_33_EXACT_TARGETS.json')
          n113 = {a['name'] for a in a113}; n114 = {a['name'] for a in a114}; n115 = {a['name'] for a in a115}
          assert len(a113) == 19 and len(a114) == 25 and len(a115) == 33
          assert n113 < n114 < n115
          assert n114 - n113 == {'SYS11','SYS37','SYS09','SYS36','SYS15','SYS16'}
          assert n115 - n114 == {'SYS13','SYS12','SYS18','SYS45','SYS10','SYS19','SYS46','STNSYS01'}
          assert len({a['lba'] for a in a115}) == 33
          assert sum(a['name'].startswith('PBOOK_') for a in a115) == 3
          assert b113['historical_verification']['changed_raw_sectors'] == 492
          assert b114['historical_verification']['changed_raw_sectors'] == 666
          assert b115['historical_verification']['changed_raw_sectors'] == 899
          assert b113['historical_verification']['reextraction'] == 'PASS_19_OF_19'
          assert b114['historical_verification']['reextraction'] == 'PASS_25_OF_25'
          assert b115['historical_verification']['reextraction'] == 'PASS_33_OF_33'
          assert b114['historical_verification']['output_disc_sha256'] == '5b54f2f532e632d024f7aa44732cdaee4b52e1b7c587a1077bbe0d741f31c704'
          assert b115['historical_verification']['output_disc_sha256'] == 'cb22622232aa13a8cc767f37563798ce8b6cdbe4e44b7e16439fab281ae2a1d1'
          assert d113['sha256'] == d114['sha256'] == d115['sha256'] == 'd6dba9f9217f0841b660263ac1d7894fc31a40cd854424a1dd4a6dfecda95106'
          PY
      - name: Validate B116-B118 cumulative exact composition
        run: |
          python tools/compose_exact_asset_lineage.py selftest
          mkdir -p /tmp/st2-lineage
          python tools/compose_exact_asset_lineage.py compose manifests/BATCH115_33_EXACT_TARGETS.json manifests/BATCH116_9_EXACT_DELTA.json --output /tmp/st2-lineage/B116.json
          python tools/compose_exact_asset_lineage.py compose manifests/BATCH115_33_EXACT_TARGETS.json manifests/BATCH116_9_EXACT_DELTA.json manifests/BATCH117_14_EXACT_DELTA.json --output /tmp/st2-lineage/B117.json
          python tools/compose_exact_asset_lineage.py compose manifests/BATCH115_33_EXACT_TARGETS.json manifests/BATCH116_9_EXACT_DELTA.json manifests/BATCH117_14_EXACT_DELTA.json manifests/BATCH118_2_EXACT_DELTA.json --output /tmp/st2-lineage/B118.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.recover_exact_assets_from_checkpoints import validate_manifest
          expected = {
              'B116.json': (116, 42, 1162, 'PASS_42_OF_42'),
              'B117.json': (117, 56, 1568, 'PASS_56_OF_56'),
              'B118.json': (118, 58, 1626, 'PASS_58_OF_58'),
          }
          loaded = {}
          for name, (batch, count, sectors, reextract) in expected.items():
              data = json.loads((Path('/tmp/st2-lineage') / name).read_text(encoding='utf-8'))
              assets, disc = validate_manifest(data)
              assert data['batch'] == batch
              assert len(assets) == count
              assert len({a['name'] for a in assets}) == count
              assert len({a['lba'] for a in assets}) == count
              assert data['historical_verification']['changed_raw_sectors'] == sectors
              assert data['historical_verification']['reextraction'] == reextract
              assert disc['sha256'] == 'd6dba9f9217f0841b660263ac1d7894fc31a40cd854424a1dd4a6dfecda95106'
              loaded[batch] = {a['name'] for a in assets}
          assert loaded[115] if 115 in loaded else True
          assert loaded[116] < loaded[117] < loaded[118]
          assert loaded[117] - loaded[116] == {'SYS06','SYS28','SYS30','SYS32','SYS35','SYS38','SYS39','SYS40','SYS41','SYS42','SYS43','SYS44','SYS48','SYS50'}
          assert loaded[118] - loaded[117] == {'SYSTEM','SYS14'}
          PY
      - name: Validate JSON manifests
        run: |
          python -m json.tool manifests/PBOOK_TARGETS.json >/dev/null
          python -m json.tool manifests/PBOOK_BT_GLYPH_TARGETS.json >/dev/null
          python -m json.tool manifests/PBOOK_BT_B110_LINEAGE.json >/dev/null
          python -m json.tool manifests/B118_CHECKPOINT_LINEAGE.json >/dev/null
          python -m json.tool manifests/B118_SIDECAR_LIBRARY.json >/dev/null
          python -m json.tool manifests/B124_SYSTEM_SYS14_TARGETS.json >/dev/null
          python -m json.tool manifests/BATCH183_187_EXACT_TARGETS.json >/dev/null
          python -m json.tool manifests/BATCH113_19_EXACT_TARGETS.json >/dev/null
          python -m json.tool manifests/BATCH114_25_EXACT_TARGETS.json >/dev/null
          python -m json.tool manifests/BATCH115_33_EXACT_TARGETS.json >/dev/null
          python -m json.tool manifests/BATCH116_9_EXACT_DELTA.json >/dev/null
          python -m json.tool manifests/BATCH117_14_EXACT_DELTA.json >/dev/null
          python -m json.tool manifests/BATCH118_2_EXACT_DELTA.json >/dev/null
          python -m json.tool manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json >/dev/null
          python -m json.tool jobs/PBOOK_BT_HEIGHT_LOW.json >/dev/null
