name: ST2 exact recovery self-tests

on:
  push:
    paths:
      - "tools/**"
      - "jobs/**"
      - "manifests/**"
      - ".github/workflows/pbook-search-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: |
          python -m py_compile tools/pbook_palette_transfer_search.py
          python -m py_compile tools/extract_glyph_by_sha.py
          python -m py_compile tools/run_pbook_bt_height_low.py
          python -m py_compile tools/recover_pbook_bt_b110.py
          python -m py_compile tools/recover_exact_patch_from_manifest.py
          python -m py_compile tools/recover_checkpoint_mosaic.py
          python -m py_compile tools/extract_apply_manifest.py
          python -m py_compile tools/recover_b118_sidecars.py
          python -m py_compile tools/recover_fixed_record_layout.py
          python -m py_compile tools/extract_mes_fixed_layout.py
          python -m py_compile tools/assemble_exact_mes_assets.py
      - name: Recover exact synthetic glyphs by SHA
        run: python tools/extract_glyph_by_sha.py selftest
      - name: Recover synthetic multi-level transfer
        run: python tools/pbook_palette_transfer_search.py selftest
      - name: Validate PBOOK raw-sector and ZIP recovery
        run: python tools/recover_pbook_bt_b110.py selftest
      - name: Validate complete exact-patch roundtrip
        run: python tools/recover_exact_patch_from_manifest.py selftest
      - name: Validate multi-checkpoint sector mosaic roundtrip
        run: python tools/recover_checkpoint_mosaic.py selftest
      - name: Validate legacy apply-script parser
        run: python tools/extract_apply_manifest.py selftest
      - name: Validate B118 sidecar recovery
        run: python tools/recover_b118_sidecars.py selftest
      - name: Validate fixed-allocation record SHA recovery
        run: python tools/recover_fixed_record_layout.py selftest
      - name: Validate MES fixed-layout SHA-oracle extraction
        run: python tools/extract_mes_fixed_layout.py selftest
      - name: Validate exact MES asset assembly
        run: python tools/assemble_exact_mes_assets.py selftest
      - name: Validate JSON manifests
        run: |
          python -m json.tool manifests/PBOOK_TARGETS.json >/dev/null
          python -m json.tool manifests/PBOOK_BT_GLYPH_TARGETS.json >/dev/null
          python -m json.tool manifests/PBOOK_BT_B110_LINEAGE.json >/dev/null
          python -m json.tool manifests/B118_CHECKPOINT_LINEAGE.json >/dev/null
          python -m json.tool manifests/B118_SIDECAR_LIBRARY.json >/dev/null
          python -m json.tool manifests/B124_SYSTEM_SYS14_TARGETS.json >/dev/null
          python -m json.tool jobs/PBOOK_BT_HEIGHT_LOW.json >/dev/null
