name: PBOOK palette search self-test

on:
  push:
    paths:
      - "tools/pbook_palette_transfer_search.py"
      - ".github/workflows/pbook-search-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile tools/pbook_palette_transfer_search.py
      - name: Recover synthetic multi-level transfer
        run: python tools/pbook_palette_transfer_search.py selftest
