name: Batch162 SK0403 SK0504 production

on:
  push:
    paths:
      - "manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json"
      - "manifests/SK0403_FINAL_EXACT_TARGET.json"
      - "manifests/SK0504_FINAL_EXACT_TARGET.json"
      - "tools/compose_production_manifests.py"
      - "tools/recover_integrate_production_assets.py"
      - ".github/workflows/batch162-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: |
          python -m py_compile tools/compose_production_manifests.py
          python -m py_compile tools/recover_integrate_production_assets.py
      - name: Validate composer selftest
        run: python tools/compose_production_manifests.py selftest
      - name: Compose exact 35-asset production manifest
        run: |
          python tools/compose_production_manifests.py compose \
            manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json \
            manifests/SK0403_FINAL_EXACT_TARGET.json \
            manifests/SK0504_FINAL_EXACT_TARGET.json \
            --output /tmp/CD1_PRODUCTION_35_ASSETS.json
      - name: Validate exact production contract
        run: |
          python tools/recover_integrate_production_assets.py validate /tmp/CD1_PRODUCTION_35_ASSETS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/CD1_PRODUCTION_35_ASSETS.json').read_text(encoding='utf-8'))
          assert p['scope']['asset_count'] == 35
          assert p['scope']['story_assets'] == 32
          assert p['scope']['movie_assets'] == 3
          assert p['scope']['subtitle_events'] == 33
          assets={a['iso_path']:a for a in p['assets']}
          assert set(['SAKURA1/SK0403.BIN','SAKURA1/SK0504.BIN']) <= set(assets)
          a=assets['SAKURA1/SK0504.BIN']
          assert a['lba'] == 45926
          assert a['size'] == 127140
          assert a['source_sha256'] == '52d5429c1d0e4029406d63f9b780bda3d78bb3de90233d4e5de488d2713d07bb'
          assert a['replacement_sha256'] == '619bee36d6e821665df9e09a0b0ffa36021b58fdbda0c3fbf0f81a9e7421f4ac'
          assert a['record_count'] == 726
          assert a['translated_text_records'] == 725
          assert a['control_records'] == 1
          assert a['reverse_decode_mismatches'] == 0
          assert a['validation'] == 'PASS_OFFLINE'
          PY
