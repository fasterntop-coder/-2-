name: Batch208 required legacy sector gate

on:
  push:
    paths:
      - 'manifests/CD1_REQUIRED_LEGACY_SECTOR_LBA208689.json'
      - 'tools/verify_required_legacy_sector.py'
      - '.github/workflows/batch208-required-legacy-sector.yml'
  pull_request:
    paths:
      - 'manifests/CD1_REQUIRED_LEGACY_SECTOR_LBA208689.json'
      - 'tools/verify_required_legacy_sector.py'
      - '.github/workflows/batch208-required-legacy-sector.yml'
  workflow_dispatch:

jobs:
  verify-manifest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate permanent exact-sector gate
        run: python tools/verify_required_legacy_sector.py
