name: Batch166 SK0505 production

on:
  push:
    paths:
      - "manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json"
      - "manifests/SK0403_FINAL_EXACT_TARGET.json"
      - "manifests/SK0504_FINAL_EXACT_TARGET.json"
      - "manifests/SK0501_FINAL_EXACT_TARGET.json"
      - "manifests/SK0502_FINAL_EXACT_TARGET.json"
      - "manifests/SK0505_FINAL_EXACT_TARGET.json"
      - "tools/compose_production_manifests.py"
      - "tools/recover_integrate_production_assets.py"
      - ".github/workflows/batch166-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: |
          python -m py_compile tools/compose_production_manifests.py
          python -m py_compile tools/recover_integrate_production_assets.py
      - name: Validate composer selftest
        run: python tools/compose_production_manifests.py selftest
      - name: Compose exact 38-asset production manifest
        run: |
          python tools/compose_production_manifests.py compose \
            manifests/CD1_PRODUCTION_STORY_MOVIE_TARGETS.json \
            manifests/SK0403_FINAL_EXACT_TARGET.json \
            manifests/SK0504_FINAL_EXACT_TARGET.json \
            manifests/SK0501_FINAL_EXACT_TARGET.json \
            manifests/SK0502_FINAL_EXACT_TARGET.json \
            manifests/SK0505_FINAL_EXACT_TARGET.json \
            --output /tmp/CD1_PRODUCTION_38_ASSETS.json
      - name: Validate exact production contract
        run: |
          python tools/recover_integrate_production_assets.py validate /tmp/CD1_PRODUCTION_38_ASSETS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/CD1_PRODUCTION_38_ASSETS.json').read_text(encoding='utf-8'))
          assert p['scope']['asset_count'] == 38
          assert p['scope']['story_assets'] == 35
          assert p['scope']['movie_assets'] == 3
          assert p['scope']['subtitle_events'] == 33
          assets={a['iso_path']:a for a in p['assets']}
          a=assets['SAKURA1/SK0505.BIN']
          assert a['lba'] == 45989
          assert a['size'] == 37136
          assert a['source_sha256'] == 'c2f59f4711a55c722e166ab4114f0f1ac88db459e3312b94a2a916fc01aa23ce'
          assert a['replacement_sha256'] == '102709b60da35894b03d2f03716b8a14735f6711031b28fad7cc995cffe73104'
          assert a['record_count'] == 86
          assert a['translated_text_records'] == 85
          assert a['control_records'] == 1
          assert a['capacity_overflow'] == 0
          assert a['line_overflow'] == 0
          assert a['japanese_remaining_in_korean'] == 0
          assert a['reverse_decode_mismatches'] == 0
          assert a['validation'] == 'PASS_OFFLINE'
          PY
